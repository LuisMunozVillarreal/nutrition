apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: nutrition
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: nutrition
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: nutrition
    spec:
      serviceAccountName: default
      volumes:
        - name: nutrition-gcp-db-backup-credentials
          secret:
            secretName: nutrition-gcp-db-backup-credentials
      containers:
        - name: backend
          image: luismunozvillarreal/nutrition-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8080
          startupProbe:
            httpGet:
              path: /healthz/
              port: 8080
            initialDelaySeconds: 15
            failureThreshold: 600
            periodSeconds: 5
          env:
            - name: ALLOWED_HOSTS
              value: "nutrition.localhost"
            - name: ENVIRONMENT
              value: "staging"
            - name: DEBUG
              value: "True"
            - name: GARMIN_ENABLED
              value: "false"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: gemini-api-key
                  name: nutrition-gemini-api-key
            - name: GARMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: nutrition-garmin-config
                  optional: true
            - name: GARMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: nutrition-garmin-config
                  optional: true
            - name: GARMIN_AUTHORIZATION_URL
              value: "https://example.com/garmin/oauth/authorize"
            - name: GARMIN_TOKEN_URL
              value: "https://example.com/garmin/oauth/token"
            - name: GARMIN_ACTIVITIES_URL
              value: "https://example.com/garmin/activities"
            - name: GARMIN_CALLBACK_URL
              value: "https://example.com/settings/garmin-callback"
            - name: GARMIN_PROVIDER_ORIGINS
              value: "https://example.com"
            - name: GARMIN_CALLBACK_ALLOWED_ORIGINS
              value: "https://example.com"
            - name: GARMIN_SCOPES
              value: "read"
            - name: GARMIN_REQUEST_TIMEOUT_SECONDS
              value: "10"
            - name: GARMIN_ACTIVITY_MAX_PAGES
              value: "200"
            - name: GARMIN_ACTIVITY_SYNC_BATCH_SIZE
              value: "200"
            - name: GARMIN_ACTIVITIES_LIMIT
              value: "100"
            - name: GARMIN_ACTIVITY_MAX_TOTAL_ITEMS
              value: "10000"
            - name: GARMIN_STATE_TTL_SECONDS
              value: "300"
            - name: GARMIN_STATE_MAX_IN_FLIGHT
              value: "5"
            - name: GARMIN_TOKEN_MAX_TTL_SECONDS
              value: "86400"
            - name: GARMIN_TOKEN_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  key: token-encryption-keys
                  name: nutrition-garmin-config
                  optional: true
            - name: GARMIN_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: token-encryption-key
                  name: nutrition-garmin-config
                  optional: true
            - name: GARMIN_REVOKE_TOKEN_URL
              value: "https://example.com/garmin/oauth/revoke"
            - name: GARMIN_ACTIVITY_ENDPOINT_MAX_RESPONSE_BYTES
              value: "1048576"
            - name: GARMIN_ACTIVITY_ENDPOINT_MAX_TOTAL_BYTES
              value: "5242880"
            - name: GARMIN_TOKEN_ENDPOINT_MAX_RESPONSE_BYTES
              value: "262144"
            - name: POSTGRESQL_HOST
              value: "nutrition-postgres"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgresql-password
                  name: nutrition-postgresql
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-key
                  name: nutrition-django-secret-key
          volumeMounts:
            - mountPath: "/mnt/secret/"
              name: nutrition-gcp-db-backup-credentials
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - ln -sf /mnt/secret/nutrition-gcp-db-backup-credentials.json /srv/www/backend/nutrition-gcp-db-backup-credentials.json
---
apiVersion: v1
kind: Service
metadata:
  name: nutrition-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: nutrition
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: nutrition
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutrition-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: nutrition
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: nutrition.localhost
spec:
  rules:
    - host: nutrition.localhost
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: nutrition-backend
                port:
                  number: 80
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: nutrition-backend
                port:
                  number: 80
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: nutrition-backend
                port:
                  number: 80
          - path: /_nested_admin
            pathType: Prefix
            backend:
              service:
                name: nutrition-backend
                port:
                  number: 80
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: nutrition-backend
                port:
                  number: 80
