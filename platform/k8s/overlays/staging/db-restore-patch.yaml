apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-backend
spec:
  template:
    spec:
      initContainers:
        - name: db-restore
          image: luismunozvillarreal/nutrition-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: CACHE_URL
              value: "redis://nutrition-redis:6379/1"
            - name: HEALTH_SYNC_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  key: token-pepper
                  name: nutrition-health-sync-secrets
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgresql-password
                  name: nutrition-postgresql
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-key
                  name: nutrition-django-secret-key
            - name: POSTGRESQL_HOST
              value: "nutrition-postgres"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: gemini-api-key
                  name: nutrition-gemini-api-key
          volumeMounts:
            - mountPath: "/mnt/secret/"
              name: nutrition-gcp-db-backup-credentials
              readOnly: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "${SKIP_DB_RESTORE:-false}" = "true" ]; then
                echo "SKIP_DB_RESTORE=true. Applying schema migrations only."
                /srv/www/backend/.venv/bin/python manage.py migrate --noinput
                exit 0
              fi

              if [ ! -f "/mnt/secret/nutrition-gcp-db-backup-credentials.json" ]; then
                echo "No backup credentials available. Skipping restore and running migrations."
                /srv/www/backend/.venv/bin/python manage.py migrate --noinput
                exit 0
              fi

              # A placeholder or malformed credentials file must not block startup.
              if ! /srv/www/backend/.venv/bin/python -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get('client_email') and d.get('private_key') else 1)" /mnt/secret/nutrition-gcp-db-backup-credentials.json; then
                echo "Backup credentials file is invalid. Skipping restore and running migrations."
                /srv/www/backend/.venv/bin/python manage.py migrate --noinput
                exit 0
              fi

              echo "Waiting for database to be ready...";
              until pg_isready -h "$POSTGRESQL_HOST" -U "nutrition"; do
                echo "Database not ready, waiting 2 seconds...";
                sleep 2;
              done
              echo "Database is ready. Checking if DB is empty...";
              
              # Symlink credentials first
              ln -s /mnt/secret/nutrition-gcp-db-backup-credentials.json /srv/www/backend/nutrition-gcp-db-backup-credentials.json;
              
              TABLE_COUNT=$(/srv/www/backend/.venv/bin/python -c "import django; django.setup(); from django.db import connection; cursor = connection.cursor(); cursor.execute(\"SELECT count(*) FROM information_schema.tables WHERE table_schema='public'\"); print(cursor.fetchone()[0])");
              
              echo "Found $TABLE_COUNT tables.";
              
              if [ "$TABLE_COUNT" -eq "0" ]; then
                echo "DB is empty. Restoring from backup...";
                /srv/www/backend/.venv/bin/python manage.py dbrestore --noinput -d nutrition;
              else
                echo "DB is not empty. Skipping restore.";
              fi
