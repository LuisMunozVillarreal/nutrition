environments:
  production:
    values:
    - production.values.yaml
  staging:
    values:
    - staging.values.yaml
releases:
- chart: ../../../backend/platform/kube
  name: backend
  namespace: '{{ .Values.namespace }}'
  values:
  - env:
    - name: ALLOWED_HOSTS
      value: '{{ .Values.domain }}'
    - name: ENVIRONMENT
      value: '{{ .Values.environment }}'
    - name: GEMINI_API_KEY
      valueFrom:
        secretKeyRef:
          key: gemini-api-key
          name: nutrition-gemini-api-key
    - name: GARMIN_ENABLED
      value: '{{ .Values.garmin.enabled }}'
    - name: GARMIN_CLIENT_ID
      valueFrom:
        secretKeyRef:
          key: client-id
          name: nutrition-garmin-config
          optional: true
    - name: GARMIN_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: client-secret
          name: nutrition-garmin-config
          optional: true
    - name: GARMIN_AUTHORIZATION_URL
      value: '{{ .Values.garmin.authorizationUrl }}'
    - name: GARMIN_TOKEN_URL
      value: '{{ .Values.garmin.tokenUrl }}'
    - name: GARMIN_ACTIVITIES_URL
      value: '{{ .Values.garmin.activitiesUrl }}'
    - name: GARMIN_CALLBACK_URL
      value: '{{ .Values.garmin.callbackUrl }}'
    - name: GARMIN_PROVIDER_ORIGINS
      value: '{{ .Values.garmin.providerOrigins }}'
    - name: GARMIN_CALLBACK_ALLOWED_ORIGINS
      value: '{{ .Values.garmin.callbackAllowedOrigins }}'
    - name: GARMIN_SCOPES
      value: '{{ .Values.garmin.scopes }}'
    - name: GARMIN_REQUEST_TIMEOUT_SECONDS
      value: '{{ .Values.garmin.requestTimeoutSeconds }}'
    - name: GARMIN_ACTIVITY_MAX_PAGES
      value: '{{ .Values.garmin.activityMaxPages }}'
    - name: GARMIN_ACTIVITY_SYNC_BATCH_SIZE
      value: '{{ .Values.garmin.activitySyncBatchSize }}'
    - name: GARMIN_ACTIVITIES_LIMIT
      value: '{{ .Values.garmin.activitiesLimit }}'
    - name: GARMIN_ACTIVITY_MAX_TOTAL_ITEMS
      value: '{{ .Values.garmin.activityMaxTotalItems }}'
    - name: GARMIN_STATE_TTL_SECONDS
      value: '{{ .Values.garmin.stateTtlSeconds }}'
    - name: GARMIN_STATE_MAX_IN_FLIGHT
      value: '{{ .Values.garmin.stateMaxInFlight }}'
    - name: GARMIN_TOKEN_MAX_TTL_SECONDS
      value: '{{ .Values.garmin.tokenMaxTtlSeconds }}'
    - name: GARMIN_TOKEN_ENCRYPTION_KEYS
      valueFrom:
        secretKeyRef:
          key: token-encryption-keys
          name: nutrition-garmin-config
          optional: true
    - name: GARMIN_TOKEN_ENCRYPTION_KEY
      valueFrom:
        secretKeyRef:
          key: token-encryption-key
          name: nutrition-garmin-config
          optional: true
    - name: GARMIN_REVOKE_TOKEN_URL
      value: '{{ .Values.garmin.revokeTokenUrl }}'
    - name: GARMIN_ACTIVITY_ENDPOINT_MAX_RESPONSE_BYTES
      value: '{{ .Values.garmin.activityEndpointMaxResponseBytes }}'
    - name: GARMIN_ACTIVITY_ENDPOINT_MAX_TOTAL_BYTES
      value: '{{ .Values.garmin.activityEndpointMaxTotalBytes }}'
    - name: GARMIN_TOKEN_ENDPOINT_MAX_RESPONSE_BYTES
      value: '{{ .Values.garmin.tokenEndpointMaxResponseBytes }}'
    - name: POSTGRESQL_PASSWORD
      valueFrom:
        secretKeyRef:
          key: postgresql-password
          name: nutrition-postgresql
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          key: secret-key
          name: nutrition-django-secret-key
    - name: DEBUG
      value: '{{ .Values.debug }}'
    garminSync:
      enabled: {{ .Values.garmin.sync.enabled }}
      suspend: {{ .Values.garmin.sync.suspend }}
      schedule: '{{ .Values.garmin.sync.schedule }}'
      timeZone: '{{ .Values.garmin.sync.timeZone }}'
      concurrencyPolicy: '{{ .Values.garmin.sync.concurrencyPolicy }}'
      startingDeadlineSeconds: {{ .Values.garmin.sync.startingDeadlineSeconds }}
      successfulJobsHistoryLimit: {{ .Values.garmin.sync.successfulJobsHistoryLimit }}
      failedJobsHistoryLimit: {{ .Values.garmin.sync.failedJobsHistoryLimit }}
      activeDeadlineSeconds: {{ .Values.garmin.sync.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.garmin.sync.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.garmin.sync.ttlSecondsAfterFinished }}
    ingress:
      annotations:
        kubernetes.io/ingress.class: traefik
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: 'true'
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
        traefik.ingress.kubernetes.io/router.tls.domains.0.main: '{{ .Values.domain
          }}'
      hosts:
      - host: '{{ .Values.domain }}'
        paths:
        - path: /admin
          pathType: Prefix
        - path: /graphql
          pathType: Prefix
        - path: /dashboard
          pathType: Prefix
        - path: /_nested_admin
          pathType: Prefix
        - path: /static
          pathType: Prefix
  version: 0.99.0+build-fb5d838-1766969108
- chart: ../../../webapp/platform/kube
  name: webapp
  namespace: '{{ .Values.namespace }}'
  values:
  - env:
    - name: GRAPHQL_ENDPOINT
      value: https://{{ .Values.domain }}/graphql/
    - name: NEXTAUTH_SECRET
      valueFrom:
        secretKeyRef:
          key: nextauth-secret
          name: nutrition-webapp-nextauth-secret
    ingress:
      annotations:
        kubernetes.io/ingress.class: traefik
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: 'true'
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
        traefik.ingress.kubernetes.io/router.tls.domains.0.main: '{{ .Values.domain
          }}'
      hosts:
      - host: '{{ .Values.domain }}'
        paths:
        - path: /
          pathType: Prefix
  version: 0.1.0
