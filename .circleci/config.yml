version: 2.1

orbs:
  kubernetes: circleci/kubernetes@1.3.1

parameters:
  backend-image:
    type: string
    default: "luismunozvillarreal/nutrition-backend:0.101.0"
  uv-venv:
    type: string
    default: "/home/backend/project/backend/.venv/"
  postgresql-image:
    type: string
    default: "cimg/postgres:17.4"
  docker-image:
    type: string
    default: "docker:24.0.9-git"

executors:
  python:
    docker:
      - image: << pipeline.parameters.backend-image >>
    environment:
      PATH: "/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin:/root/.local/bin"
      GEMINI_API_KEY: "TestingApiKey"
      SECRET_KEY: "TestingSecretKeyThatIsAtLeast32BytesLong"
  python-postgresql:
    docker:
      - image: << pipeline.parameters.backend-image >>
      - image: << pipeline.parameters.postgresql-image >>
        environment:
          POSTGRES_USER: nutrition
    environment:
      GEMINI_API_KEY: "TestingApiKey"
      SECRET_KEY: "TestingSecretKeyThatIsAtLeast32BytesLong"

commands:
  python-dependencies:
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          name: Restore Python Dependencies
          keys:
            - python-packages-{{ checksum "uv.lock" }}-v1
      - run:
          name: Install Python Dependencies
          command: uv sync
      - save_cache:
          name: Save Python Dependencies
          key: python-packages-{{ checksum "uv.lock" }}-v1
          paths:
            - << pipeline.parameters.uv-venv >>

  gcp-credentials:
    steps:
      - run:
          name: Create GCP credential JSON
          command: echo $GCLOUD_SERVICE_KEY > nutrition-gcp-db-backup-credentials.json

  docker-login:
    steps:
      - run:
          name: Docker Login
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin

  setup-kubeconfig:
    steps:
      - run:
          name: Setup Kubeconfig
          command: |
             mkdir -p $HOME/.kube
             echo "$KUBECONFIG_DATA_BASE64" | base64 -d > $HOME/.kube/config
             chmod 600 $HOME/.kube/config

  wait-for-flux-reconciliation:
    parameters:
      kustomization_name:
        type: string
      target_namespace:
        type: string
    steps:
      - run:
          name: Wait for Flux Kustomization reconciliation
          no_output_timeout: 10m
          command: |
            echo "Triggering reconciliation for << parameters.kustomization_name >>..."
            kubectl annotate kustomization << parameters.kustomization_name >> -n flux-system reconcile.fluxcd.io/requestedAt=$(date +%s) --overwrite
            
            echo "Waiting for Flux Kustomization readiness..."
            kubectl wait --for=condition=ready kustomization/<< parameters.kustomization_name >> -n flux-system --timeout=600s
            
            echo "Waiting for backend pods in << parameters.target_namespace >>..."
            kubectl rollout status deployment/nutrition-backend -n << parameters.target_namespace >> --timeout=600s
            
            echo "Waiting for webapp pods in << parameters.target_namespace >>..."
            kubectl rollout status deployment/nutrition-webapp -n << parameters.target_namespace >> --timeout=600s

  validate:
    parameters:
      env:
        type: string
    steps:
      - run:
          name: << parameters.env >>
          command: make << parameters.env >>

jobs:
  pytest:
    working_directory: ~/project/backend
    executor: python-postgresql
    steps:
      - python-dependencies
      - gcp-credentials
      - validate:
          env: pytest
  bandit:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - validate:
          env: bandit
  flake8:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - validate:
          env: flake8
  black:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - validate:
          env: black
  mypy:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - gcp-credentials
      - validate:
          env: mypy
  pylint:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - gcp-credentials
      - validate:
          env: pylint
  pylint-tests:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - gcp-credentials
      - validate:
          env: pylint-tests
  pydocstyle:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - validate:
          env: pydocstyle
  pydocstyle-tests:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - validate:
          env: pydocstyle-tests

  webapp-checks:
    working_directory: ~/project/webapp
    docker:
      - image: cimg/node:22.23
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install Frontend Dependencies
          command: npm ci
      - run:
          name: Run Frontend Tests
          command: npm test
      - run:
          name: Run Frontend Type Check
          command: npx tsc --noEmit
      - run:
          name: Run Frontend Lint
          command: npm run lint

  backend-dependency-audit:
    working_directory: ~/project/backend
    executor: python
    steps:
      - python-dependencies
      - run:
          name: Export Production Backend Lockfile
          command: |
            uv export --format requirements-txt --no-hashes --no-dev > /tmp/backend-production-requirements.txt
      - run:
          name: Run Backend Production Dependency Audit
          command: |
            IGNORE_ARGS=""
            if [ -f ../.circleci/dependency-audit-pip-allowlist.txt ]; then
              while IFS= read -r vuln_id; do
                case "$vuln_id" in
                  ""|\#*)
                    continue
                    ;;
                esac
                IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $vuln_id"
              done < ../.circleci/dependency-audit-pip-allowlist.txt
            fi

            uvx --from pip-audit pip-audit \
              -r /tmp/backend-production-requirements.txt \
              --no-deps \
              --disable-pip \
              $IGNORE_ARGS

  webapp-dependency-audit:
    working_directory: ~/project/webapp
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install Frontend Dependencies
          command: npm ci
      - run:
          name: Run Frontend Production Dependency Audit
          command: |
