  backend-docker-build-tag-push:
    working_directory: ~/project/backend
    docker:
      - image: << pipeline.parameters.docker-image >>
    steps:
      - checkout:
          path: ~/project
      - setup_remote_docker:
          version: docker24
          docker_layer_caching: true
      - docker-login
      - run:
          name: Build, Tag and Push Backend
          command: |
             apk add --no-cache make
             TAG=$CIRCLE_SHA1 make docker-build-tag-push

  webapp-docker-build-tag-push:
    working_directory: ~/project/webapp
    docker:
      - image: << pipeline.parameters.docker-image >>
    steps:
      - checkout:
          path: ~/project
      - setup_remote_docker:
          version: docker24
          docker_layer_caching: true
      - docker-login
      - run:
          name: Build, Tag and Push Webapp
          command: |
             apk add --no-cache make
             TAG=$CIRCLE_SHA1 make docker-build-tag-push

  deploy-preview:
    working_directory: ~/project
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:eUMnZKevcHtp4GT33VoOns8oPBGWlMP3oPHfhmlfW9k"
      - kubernetes/install
      - setup-kubeconfig
      - run:
          name: Generate Flux Preview
          command: |
            python3 .circleci/scripts/generate_flux_preview.py "$CIRCLE_BRANCH" "$CIRCLE_SHA1"
      - run:
          name: Clone Secrets to Preview Namespace
          command: |
            python3 .circleci/scripts/clone_preview_secrets.py "$CIRCLE_BRANCH"
      - run:
          name: Wait for Deployment Readiness
          no_output_timeout: 10m
          command: |
            SANITIZED_BRANCH=$(python3 .circleci/scripts/sanitise_branch.py "$CIRCLE_BRANCH")
            TARGET_NAMESPACE="nutrition-staging--${SANITIZED_BRANCH}"
            KUSTOMIZATION_NAME="nutrition-preview-${SANITIZED_BRANCH}"
            
            echo "Waiting for Flux Kustomization..."
            kubectl wait --for=condition=ready kustomization/${KUSTOMIZATION_NAME} -n flux-system --timeout=600s
            
            echo "Checking backend rollout status..."
            kubectl rollout status deployment/nutrition-backend -n ${TARGET_NAMESPACE} --timeout=600s
            
            echo "Checking webapp rollout status..."
            kubectl rollout status deployment/nutrition-webapp -n ${TARGET_NAMESPACE} --timeout=600s

  deploy-staging:
    working_directory: ~/project
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:eUMnZKevcHtp4GT33VoOns8oPBGWlMP3oPHfhmlfW9k"
      - kubernetes/install
      - setup-kubeconfig
      - run:
          name: Patch Staging Flux Kustomization
          command: |
            kubectl patch kustomization nutrition-staging -n flux-system --type='merge' -p='{"spec": {"images": [{"name": "luismunozvillarreal/nutrition-backend", "newTag": "'$CIRCLE_SHA1'"}, {"name": "luismunozvillarreal/nutrition-webapp", "newTag": "'$CIRCLE_SHA1'"}]}}'
      - wait-for-flux-reconciliation:
          kustomization_name: nutrition-staging
          target_namespace: nutrition-staging

  deploy-production:
    working_directory: ~/project
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:eUMnZKevcHtp4GT33VoOns8oPBGWlMP3oPHfhmlfW9k"
      - kubernetes/install
      - setup-kubeconfig
      - run:
          name: Patch Production Flux Kustomization
          command: |
            kubectl patch kustomization nutrition-production -n flux-system --type='merge' -p='{"spec": {"images": [{"name": "luismunozvillarreal/nutrition-backend", "newTag": "'$CIRCLE_SHA1'"}, {"name": "luismunozvillarreal/nutrition-webapp", "newTag": "'$CIRCLE_SHA1'"}]}}'
      - wait-for-flux-reconciliation:
          kustomization_name: nutrition-production
          target_namespace: nutrition-production

  cypress-e2e:
    working_directory: ~/project
    docker:
      - image: cimg/node:22.23-browsers
    steps:
      - checkout
      - kubernetes/install
      - setup-kubeconfig
      - run:
          name: Install Dependencies
          working_directory: ~/project/webapp
          command: npm ci
      - run:
          name: Seed, Run Cypress, and Cleanup E2E Accounts
          working_directory: ~/project/webapp
          command: |
            set +x
            set -Eeuo pipefail

            SANITIZED_BRANCH=$(python3 ../.circleci/scripts/sanitise_branch.py "$CIRCLE_BRANCH")
            NAMESPACE="nutrition-staging--${SANITIZED_BRANCH}"
            E2E_RUN_TOKEN="$(openssl rand -hex 16)"
            E2E_RUN_MARKER="__e2e_run_${E2E_RUN_TOKEN}__"
            E2E_REGULAR_EMAIL="e2e-regular-${E2E_RUN_TOKEN}@example.com"
            E2E_STAFF_EMAIL="e2e-staff-${E2E_RUN_TOKEN}@example.com"
            E2E_REGULAR_PASSWORD="$(openssl rand -hex 32)"
            E2E_STAFF_PASSWORD="$(openssl rand -hex 32)"

            run_backend() {
              printf '%s\n' "$E2E_LIFECYCLE_PAYLOAD" \
                | kubectl exec -i -n "$NAMESPACE" deployment/nutrition-backend -- "$@"
            }

            cleanup() {
              status=$?
              trap - EXIT
              set +e
              run_backend python3 -m scripts.manage_e2e_users cleanup
              cleanup_status=$?
              if [ "$cleanup_status" -ne 0 ]; then
                run_backend python3 -m scripts.manage_e2e_users cleanup
                cleanup_status=$?
              fi
              unset E2E_LIFECYCLE_PAYLOAD \
                E2E_RUN_TOKEN E2E_RUN_MARKER \
                E2E_REGULAR_EMAIL E2E_REGULAR_PASSWORD \
                E2E_STAFF_EMAIL E2E_STAFF_PASSWORD
              if [ "$cleanup_status" -ne 0 ]; then
                echo "E2E account cleanup failed." >&2
              fi
              if [ "$status" -eq 0 ] && [ "$cleanup_status" -ne 0 ]; then
                exit "$cleanup_status"
              fi
              exit "$status"
            }
            trap cleanup EXIT

            printf -v E2E_LIFECYCLE_PAYLOAD \
              '{"regular_email":"%s","regular_password":"%s","staff_email":"%s","staff_password":"%s","run_marker":"%s"}' \
              "$E2E_REGULAR_EMAIL" "$E2E_REGULAR_PASSWORD" \
              "$E2E_STAFF_EMAIL" "$E2E_STAFF_PASSWORD" "$E2E_RUN_MARKER"

            run_backend python3 -m scripts.manage_e2e_users seed
            run_backend python3 -m scripts.seed_test_day

            if [ -z "${BASE_DOMAIN:-}" ]; then
              BASE_DOMAIN=$(kubectl get configmap cluster-settings -n flux-system -o jsonpath='{.data.BASE_DOMAIN}')
            fi
            if [ -z "$BASE_DOMAIN" ]; then
              echo "Required domain configuration is unavailable." >&2
              exit 1
            fi

            export REAL_DOMAIN="staging--${SANITIZED_BRANCH}.${BASE_DOMAIN}"
            export TESTING_DOMAIN="staging-${SANITIZED_BRANCH}.testing-domain"

            sudo apt-get update
            sudo apt-get install -y nginx gettext-base
            sudo mkdir -p /etc/nginx/ssl
            sudo openssl req -x509 -newkey rsa:4096 \
              -keyout /etc/nginx/ssl/key.pem \
              -out /etc/nginx/ssl/cert.pem \
              -days 365 -nodes -subj "/CN=$TESTING_DOMAIN" >/dev/null 2>&1
            envsubst '$REAL_DOMAIN $TESTING_DOMAIN' \
              < ../.circleci/nginx-masking-proxy.conf \
              | sudo tee /etc/nginx/sites-available/masking-proxy >/dev/null
            sudo ln -sf /etc/nginx/sites-available/masking-proxy /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo service nginx restart
            echo "127.0.0.1 $TESTING_DOMAIN" | sudo tee -a /etc/hosts >/dev/null

            CYPRESS_BASE_URL="https://$TESTING_DOMAIN" \
              CYPRESS_E2E_REGULAR_EMAIL="$E2E_REGULAR_EMAIL" \
              CYPRESS_E2E_REGULAR_PASSWORD="$E2E_REGULAR_PASSWORD" \
              CYPRESS_E2E_STAFF_EMAIL="$E2E_STAFF_EMAIL" \
              CYPRESS_E2E_STAFF_PASSWORD="$E2E_STAFF_PASSWORD" \
              CYPRESS_E2E_RUN_MARKER="$E2E_RUN_MARKER" \
              npm run cypress:run
      - store_artifacts:
          path: ~/project/webapp/cypress/videos
      - store_artifacts:
          path: ~/project/webapp/cypress/screenshots

workflows:
  version: 2
  ValidationWorkflow:
    jobs:
      - pytest
      - bandit
      - flake8
      - black
      - mypy
      - pylint
      - pylint-tests
      - pydocstyle
      - pydocstyle-tests
      - backend-dependency-audit
      - webapp-dependency-audit
      - webapp-checks
      - backend-docker-build-tag-push:
          context:
            - Docker
          requires:
            - pytest
            - bandit
            - flake8
            - black
            - mypy
            - pylint
            - pylint-tests
            - pydocstyle
            - pydocstyle-tests
            - backend-dependency-audit
      - webapp-docker-build-tag-push:
          context:
            - Docker
          requires:
            - webapp-checks
            - webapp-dependency-audit
      - deploy-preview:
          context:
            - kubeconfig
          requires:
            - backend-docker-build-tag-push
            - webapp-docker-build-tag-push
          filters:
            branches:
              ignore:
                - main
      - deploy-production:
          context:
            - kubeconfig
          requires:
            - backend-docker-build-tag-push
            - webapp-docker-build-tag-push
          filters:
            branches:
              only:
                - main
      - deploy-staging:
          context:
            - kubeconfig
          requires:
            - backend-docker-build-tag-push
            - webapp-docker-build-tag-push
          filters:
            branches:
              only:
                - main
      - cypress-e2e:
          context:
            - kubeconfig
          requires:
            - deploy-preview
