apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nutrition.fullname" . }}-dbbackup
spec:
  schedule: "50 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "nutrition.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          volumes:
            - name: nutrition-gcp-db-backup-credentials
              secret:
                secretName: nutrition-gcp-db-backup-credentials
          containers:
          - name: {{ .Chart.Name }}-dbbackup
            image: {{ .Values.image.repository }}:{{ include "nutrition.imageTag" . }}
            imagePullPolicy: IfNotPresent
            securityContext:
              {{- toYaml .Values.securityContext | nindent 14 }}
            {{- with .Values.env }}
            env:
              {{- toYaml . | nindent 12 }}
            {{- end }}
            volumeMounts:
              - mountPath: "/mnt/secret/"
                name: nutrition-gcp-db-backup-credentials
                readOnly: true
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - ln -sf /mnt/secret/nutrition-gcp-db-backup-credentials.json /srv/www/backend/nutrition-gcp-db-backup-credentials.json
            command:
              - /bin/bash
              - -c
            args:
              - echo "Backing up DB..." &&
                [ $ENVIRONMENT == production ] &&
                source $SRC_DIR/.venv/bin/activate &&
                python manage.py dbbackup -v 3 &&
                echo "Completed" ||
                echo "DB backup runs only in production"
          restartPolicy: OnFailure
